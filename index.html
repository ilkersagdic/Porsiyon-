<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Porsiyon">
<title>Porsiyon Takip</title>
<style>
:root{
  --bg:#eef3f0; --card:#ffffff; --tx:#13211b; --mut:#5f6f67; --line:#dbe4df; --track:#e3ebe6;
  --ok:#1f8a5b; --warn:#c77a12; --bad:#c23b32; --acc:#14543d; --accfg:#ffffff;
  --sut:#3b78c4; --ekmek:#b9822b; --sebze:#3f9a4a; --meyve:#d4503f; --et:#8b4f86;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1713; --card:#17221c; --tx:#e7f0ea; --mut:#92a59b; --line:#27362e; --track:#22302a;
    --ok:#46c28b; --warn:#e4a443; --bad:#ec6b61; --acc:#6fd3a7; --accfg:#0d1a14;
    --sut:#6aa3e6; --ekmek:#dba650; --sebze:#6bc577; --meyve:#f08272; --et:#c486bf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1713; --card:#17221c; --tx:#e7f0ea; --mut:#92a59b; --line:#27362e; --track:#22302a;
  --ok:#46c28b; --warn:#e4a443; --bad:#ec6b61; --acc:#6fd3a7; --accfg:#0d1a14;
  --sut:#6aa3e6; --ekmek:#dba650; --sebze:#6bc577; --meyve:#f08272; --et:#c486bf;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100%;
  font-family:"Avenir Next","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:10px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.daylabel{font-weight:700;font-size:19px;min-width:128px;text-align:center}
.daylabel small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.linkbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--mut)}

/* portion rows */
.grp{padding:10px 0;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:2px}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp-name{font-weight:700}
.grp-count{font-variant-numeric:tabular-nums;font-weight:700}
.grp-count span{color:var(--mut);font-weight:500}
.pips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pip{width:26px;height:26px;border-radius:8px;border:2px solid var(--gc);background:transparent;position:relative;overflow:hidden}
.pip i{position:absolute;inset:0;background:var(--gc)}
.pip.opt{border-style:dashed;opacity:.8}
.pip.over{border-color:var(--bad)}
.pip.over i{background:var(--bad)}
.grp-note{font-size:13px;margin-top:6px;color:var(--mut)}
.grp-note.ok{color:var(--ok);font-weight:600}
.grp-note.warn{color:var(--warn);font-weight:600}
.grp-note.bad{color:var(--bad);font-weight:600}

.extra{display:flex;justify-content:space-between;font-size:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--mut)}
.extra b{color:var(--tx)}

/* weekly protein */
.week{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wk{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.wk b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.wk span{font-size:12px;color:var(--mut)}
.wk.done{border-color:var(--ok)}
.wk.over{border-color:var(--warn)}

/* add area */
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.sec{margin-top:14px}
.sec h3{margin:0 0 6px;font-size:14px;color:var(--mut);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;text-align:left}
.chip:active{transform:scale(.97);background:var(--track)}
.chip small{display:block;color:var(--mut);font-size:12px}

/* log */
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm div{font-weight:600;overflow-wrap:anywhere}
.entry .nm small{color:var(--mut);font-size:12px}
.entry .tm{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.del{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:18px;color:var(--mut)}
.empty{color:var(--mut);padding:6px 0}

details{margin-top:14px}
summary{cursor:pointer;font-weight:700;color:var(--mut);font-size:14px;padding:6px 0}
.cust{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cust label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.cust input,.cust select,textarea{font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);width:100%}
.cust .full{grid-column:1/-1}
.primary{background:var(--acc);color:var(--accfg);border:0;border-radius:12px;padding:11px 14px;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);
  background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:20;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="daynav">
      <button id="prev" aria-label="Önceki gün">‹</button>
      <div class="daylabel" id="dayLabel"></div>
      <button id="next" aria-label="Sonraki gün">›</button>
    </div>
    <button class="linkbtn" id="todayBtn">Bugün</button>
  </header>

  <section class="card" id="summary" aria-live="polite"></section>

  <section class="card">
    <h2>Bu hafta · protein çeşidi</h2>
    <div class="week" id="week"></div>
  </section>

  <section class="card">
    <h2>Ekle</h2>
    <div class="seg" role="group" aria-label="Miktar çarpanı" id="mult">
      <button data-m="0.5" aria-pressed="false">½</button>
      <button data-m="1" aria-pressed="true">1</button>
      <button data-m="1.5" aria-pressed="false">1½</button>
      <button data-m="2" aria-pressed="false">2</button>
    </div>
    <div id="presets"></div>

    <details>
      <summary>Listede olmayan bir şey ekle</summary>
      <div class="cust">
        <label class="full">Ad<input id="cName" placeholder="Örn. 1 dilim peynirli tost"></label>
        <label>Süt<input id="cSut" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
        <label>Ekmek<input id="cEkmek" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
        <label>Sebze<input id="cSebze" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
        <label>Meyve<input id="cMeyve" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
        <label>Et grubu<input id="cEt" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
        <label>Yağ (yemek kaşığı)<input id="cYag" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
        <label class="full">Protein türü
          <select id="cKind">
            <option value="">Yok / peynir / yumurta</option>
            <option value="kirmizi">Kırmızı et</option>
            <option value="beyaz">Beyaz et</option>
            <option value="kurubaklagil">Kurubaklagil</option>
          </select>
        </label>
      </div>
      <div class="row"><button class="primary" id="cAdd">Kaydet</button></div>
    </details>
  </section>

  <section class="card">
    <h2>Bugünün kaydı</h2>
    <div id="log"></div>
  </section>

  <section class="card">
    <details style="margin-top:0">
      <summary>Yedekle / geri yükle</summary>
      <p class="hint">Veriler yalnızca bu cihazdaki tarayıcıda durur. Safari verisini temizlerseniz veya uygulamayı silerseniz gider. Arada bir yedeği kopyalayıp Notlar’a yapıştırın.</p>
      <div class="row">
        <button class="ghost" id="bShow">Yedeği göster</button>
        <button class="ghost" id="bCopy">Kopyala</button>
        <button class="ghost" id="bImport">İçe aktar</button>
      </div>
      <textarea id="bBox" placeholder="Yedek metni burada görünür. Geri yüklemek için buraya yapıştırıp “İçe aktar”a basın." style="margin-top:8px"></textarea>
      <p class="hint" id="bMsg"></p>
    </details>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
const GROUPS=[
  {k:'sut',n:'Süt grubu',min:4,max:4,c:'--sut',hint:'1 su bardağı süt = 1 kase yoğurt = 4 yk yoğurt = 1 su bardağı kefir'},
  {k:'ekmek',n:'Ekmek grubu',min:6,max:6,c:'--ekmek',hint:'1 dilim ekmek = 3 yk pilav/makarna = 1 kepçe çorba = 1 küçük patates'},
  {k:'sebze',n:'Sebze grubu',min:5,max:5,c:'--sebze',hint:''},
  {k:'meyve',n:'Meyve grubu',min:3,max:3,c:'--meyve',strict:true,hint:'Kesinlikle 4 değil, gündüz saatlerinde'},
  {k:'et',n:'Et · yumurta · peynir · baklagil',min:5,max:6,c:'--et',hint:'2 dilim peynir = 1 porsiyon et'}
];
const PRESETS=[
  {sec:'Ekmek grubu',items:[
    {n:'1 dilim ekmek',p:{ekmek:1}},{n:'3 yk pilav/makarna',p:{ekmek:1}},
    {n:'1 kepçe çorba',p:{ekmek:1}},{n:'1 küçük patates',p:{ekmek:1}}]},
  {sec:'Süt grubu',items:[
    {n:'1 su bardağı süt',p:{sut:1}},{n:'1 kase yoğurt',p:{sut:1}},
    {n:'4 yk yoğurt',p:{sut:1}},{n:'1 su bardağı kefir',p:{sut:1}}]},
  {sec:'Sebze ve meyve',items:[
    {n:'1 porsiyon sebze',p:{sebze:1}},{n:'1 porsiyon meyve',p:{meyve:1}}]},
  {sec:'Et · yumurta · peynir',items:[
    {n:'1 yumurta',p:{et:1}},{n:'2 dilim peynir',p:{et:1}},
    {n:'Kırmızı et 30 g',p:{et:1},kind:'kirmizi'},
    {n:'Beyaz et 1 porsiyon',p:{et:1},kind:'beyaz'},
    {n:'Kurubaklagil 1 porsiyon',p:{et:1},kind:'kurubaklagil'}]},
  {sec:'Hazır yemekler',items:[
    {n:'1 dilim kıymalı börek',p:{ekmek:2,et:1},yag:1,kind:'kirmizi'},
    {n:'1 adet simit',p:{ekmek:4},yag:0.5},
    {n:'1 adet un kurabiyesi',p:{ekmek:1},yag:1},
    {n:'1 tabak mantı',p:{ekmek:4,et:2},yag:1,kind:'kirmizi'},
    {n:'1 dilim yaş pasta',p:{ekmek:2,meyve:2},yag:1},
    {n:'1 dilim pizza',p:{ekmek:1,et:1},yag:2,kind:'kirmizi'},
    {n:'1 adet pişi',p:{ekmek:1},yag:2}]},
  {sec:'Yağ',items:[
    {n:'1 yk sıvıyağ',yag:1},{n:'1 yk tereyağ',yag:1},{n:'1 tatlı kaşığı sıvıyağ',yag:0.5}]}
];
const WEEK_TARGETS=[{k:'kirmizi',n:'Kırmızı et',t:2},{k:'beyaz',n:'Beyaz et',t:3},{k:'kurubaklagil',n:'Kurubaklagil',t:1}];
const KEY='porsiyon-takip:v1';

let data={days:{}};
let cur=todayStr();
let mult=1;
let lastRemoved=null;
let toastTimer=null;

function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return dstr(new Date())}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function shift(s,n){const d=parse(s);d.setDate(d.getDate()+n);return dstr(d)}
function fmt(n){return (Math.round(n*100)/100).toString().replace('.',',')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw); if(o&&o.days) data=o;}
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
}
function entries(s){return data.days[s]||[]}
function totals(s){
  const t={sut:0,ekmek:0,sebze:0,meyve:0,et:0,yag:0};
  entries(s).forEach(e=>{
    for(const k in (e.p||{})) t[k]+=e.p[k];
    t.yag+=e.yag||0;
  });
  return t;
}

function toast(msg,undo){
  const el=document.getElementById('toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button id="undoBtn">Geri al</button>':'');
  el.classList.add('show');
  if(undo) document.getElementById('undoBtn').onclick=undo;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),undo?5000:1400);
}

function addEntry(name,p,yag,kind){
  const now=new Date();
  const e={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),name,p:p||{},yag:yag||0,kind:kind||null,
    t:pad(now.getHours())+':'+pad(now.getMinutes())};
  (data.days[cur]=data.days[cur]||[]).push(e);
  save();render();
  return e;
}
function addPreset(it){
  const p={};
  for(const k in (it.p||{})) p[k]=it.p[k]*mult;
  const name=mult===1?it.n:fmt(mult)+' × '+it.n;
  addEntry(name,p,(it.yag||0)*mult,it.kind);
  toast('Eklendi: '+name);
}
function removeEntry(id){
  const list=entries(cur);
  const i=list.findIndex(e=>e.id===id);
  if(i<0) return;
  const [e]=list.splice(i,1);
  if(!list.length) delete data.days[cur];
  lastRemoved={e,date:cur,i};
  save();render();
  toast('Silindi',()=>{
    if(!lastRemoved) return;
    const arr=(data.days[lastRemoved.date]=data.days[lastRemoved.date]||[]);
    arr.splice(Math.min(lastRemoved.i,arr.length),0,lastRemoved.e);
    lastRemoved=null;save();render();
    document.getElementById('toast').classList.remove('show');
  });
}

function pipsFor(g,v){
  const slots=Math.max(g.max,Math.ceil(v));
  let h='';
  for(let i=0;i<slots;i++){
    const fill=Math.max(0,Math.min(1,v-i));
    const isOver=i>=g.max;
    const isOpt=!isOver && i>=g.min;
    let cls='pip'+(isOver?' over':'')+(isOpt?' opt':'');
    h+='<span class="'+cls+'" style="--gc:var('+g.c+')">'+(fill>0?'<i style="width:'+(fill*100)+'%"></i>':'')+'</span>';
  }
  return h;
}

function renderSummary(){
  const t=totals(cur);
  let h='';
  GROUPS.forEach(g=>{
    const v=t[g.k];
    let note='',cls='';
    if(v<g.min){note='Kalan: '+fmt(g.min-v)+' porsiyon';}
    else if(v<=g.max){
      cls='ok';
      note=(g.min===g.max||v>=g.max)?'Tamamlandı':'Hedef tamam, '+fmt(g.max-v)+' porsiyon daha yenebilir';
    }else{
      cls=g.strict?'bad':'warn';
      note=(g.strict?'Limit aşıldı: ':'Üst sınırın üstünde: ')+'+'+fmt(v-g.max);
    }
    const lim=g.min===g.max?fmt(g.max):g.min+'–'+g.max;
    h+='<div class="grp" style="--gc:var('+g.c+')">'+
      '<div class="grp-head"><span class="grp-name">'+esc(g.n)+'</span>'+
      '<span class="grp-count">'+fmt(v)+' <span>/ '+lim+'</span></span></div>'+
      '<div class="pips">'+pipsFor(g,v)+'</div>'+
      '<div class="grp-note '+cls+'">'+esc(note)+'</div></div>';
  });
  h+='<div class="extra"><span>Eklenen yağ</span><b>'+fmt(t.yag)+' yemek kaşığı</b></div>';
  document.getElementById('summary').innerHTML=h;
}

function weekDates(s){
  const d=parse(s);
  const dow=(d.getDay()+6)%7; // Monday=0
  const start=shift(s,-dow);
  return Array.from({length:7},(_,i)=>shift(start,i));
}
function renderWeek(){
  const days=weekDates(cur);
  const counts={kirmizi:0,beyaz:0,kurubaklagil:0};
  days.forEach(d=>{
    const kinds=new Set(entries(d).map(e=>e.kind).filter(Boolean));
    kinds.forEach(k=>{if(k in counts) counts[k]++;});
  });
  document.getElementById('week').innerHTML=WEEK_TARGETS.map(w=>{
    const c=counts[w.k];
    const cls=c>w.t?'over':(c===w.t?'done':'');
    return '<div class="wk '+cls+'"><b>'+c+' / '+w.t+'</b><span>'+w.n+' · gün</span></div>';
  }).join('');
}

function renderLog(){
  const list=entries(cur);
  const box=document.getElementById('log');
  if(!list.length){box.innerHTML='<div class="empty">Henüz kayıt yok. Yukarıdan bir şey ekleyin.</div>';return;}
  const names={sut:'süt',ekmek:'ekmek',sebze:'sebze',meyve:'meyve',et:'et'};
  box.innerHTML=list.slice().reverse().map(e=>{
    const parts=[];
    for(const k in e.p){ if(e.p[k]) parts.push(fmt(e.p[k])+' '+names[k]); }
    if(e.yag) parts.push(fmt(e.yag)+' yk yağ');
    return '<div class="entry"><div class="nm"><div>'+esc(e.name)+'</div><small>'+esc(parts.join(' · '))+'</small></div>'+
      '<span class="tm">'+esc(e.t||'')+'</span>'+
      '<button class="del" data-id="'+esc(e.id)+'" aria-label="Sil: '+esc(e.name)+'">×</button></div>';
  }).join('');
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>removeEntry(b.dataset.id));
}

function renderHeader(){
  const isToday=cur===todayStr();
  const d=parse(cur);
  const dayName=d.toLocaleDateString('tr-TR',{weekday:'long'});
  const full=d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
  document.getElementById('dayLabel').innerHTML=(isToday?'Bugün':esc(dayName))+'<small>'+esc(isToday?dayName+', '+full:full)+'</small>';
  document.getElementById('todayBtn').style.visibility=isToday?'hidden':'visible';
}

function render(){renderHeader();renderSummary();renderWeek();renderLog();}

function buildPresets(){
  const box=document.getElementById('presets');
  box.innerHTML=PRESETS.map((s,si)=>
    '<div class="sec"><h3>'+esc(s.sec)+'</h3><div class="chips">'+
    s.items.map((it,ii)=>'<button class="chip" data-s="'+si+'" data-i="'+ii+'">'+esc(it.n)+'</button>').join('')+
    '</div></div>').join('');
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>addPreset(PRESETS[b.dataset.s].items[b.dataset.i]));
}

function setup(){
  document.getElementById('prev').onclick=()=>{cur=shift(cur,-1);render();};
  document.getElementById('next').onclick=()=>{cur=shift(cur,1);render();};
  document.getElementById('todayBtn').onclick=()=>{cur=todayStr();render();};
  document.querySelectorAll('#mult button').forEach(b=>b.onclick=()=>{
    mult=parseFloat(b.dataset.m);
    document.querySelectorAll('#mult button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  });
  document.getElementById('cAdd').onclick=()=>{
    const num=id=>Math.max(0,parseFloat(document.getElementById(id).value.replace(',','.'))||0);
    const name=document.getElementById('cName').value.trim()||'Özel kayıt';
    const p={sut:num('cSut'),ekmek:num('cEkmek'),sebze:num('cSebze'),meyve:num('cMeyve'),et:num('cEt')};
    Object.keys(p).forEach(k=>{if(!p[k]) delete p[k];});
    const yag=num('cYag');
    if(!Object.keys(p).length && !yag){toast('En az bir porsiyon değeri girin');return;}
    addEntry(name,p,yag,document.getElementById('cKind').value||null);
    ['cName'].forEach(id=>document.getElementById(id).value='');
    ['cSut','cEkmek','cSebze','cMeyve','cEt','cYag'].forEach(id=>document.getElementById(id).value='0');
    toast('Eklendi: '+name);
  };
  const box=document.getElementById('bBox'),msg=document.getElementById('bMsg');
  document.getElementById('bShow').onclick=()=>{box.value=JSON.stringify(data);msg.textContent='Yedek hazır. Kopyalayıp Notlar’a yapıştırın.';};
  document.getElementById('bCopy').onclick=async()=>{
    box.value=JSON.stringify(data);
    try{await navigator.clipboard.writeText(box.value);msg.textContent='Kopyalandı.';}
    catch(e){box.focus();box.select();msg.textContent='Otomatik kopyalanamadı. Metin seçildi, elle kopyalayın.';}
  };
  document.getElementById('bImport').onclick=()=>{
    try{
      const o=JSON.parse(box.value);
      if(!o||typeof o.days!=='object') throw new Error('x');
      data=o;save();render();msg.textContent='Yedek yüklendi.';
    }catch(e){msg.textContent='Yedek okunamadı. Metnin tamamını yapıştırdığınızdan emin olun.';}
  };
}

load();buildPresets();setup();render();
</script>
</body>
</html>
